<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>速达开锁</title>

    <!-- 预解析CDN连接 -->
    <link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="https://cdn.staticfile.org/animejs/3.2.1/anime.min.js" as="script">

    <!-- 内联所有关键CSS（消除请求阻塞，同时修复PC端按钮样式） -->
    <style>
        /* 1. 精简后的normalize核心规则 */
        article,aside,details,figcaption,figure,footer,header,hgroup,main,nav,section,summary{display:block}
        audio,canvas,video{display:inline-block}
        [hidden]{display:none}
        html{font-family:sans-serif;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%}
        body{margin:0}
        a:focus{outline:thin dotted}
        a:active,a:hover{outline:0}
        img{border:0}
        button,input,select,textarea{font-family:inherit;font-size:100%;margin:0}
        table{border-collapse:collapse;border-spacing:0}

        /* 2. 精简后的reset基础样式 */
        body,html{font-size:100%;padding:0;margin:0;height:100%;}
        *,*:after,*:before{-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box}
        body{background:#494A5F;color:#D5D6E2;font-weight:500;font-size:1.05em;font-family:"Microsoft YaHei",sans-serif}

        /* 3. 滑块核心样式 + PC端按钮修复 */
        .page-wrapper{width:100%;height:100%;}
        .slider{position:relative;overflow:hidden;width:100%;height:100%;}
        .slider-list{list-style:none;margin:0;padding:0;height:100%;}
        .slider-list__item { 
            position:absolute;top:0;left:0;width:100%;height:100%;
            opacity:0;transition:opacity .5s ease;
            background-color: #f0f0f0; 
            z-index:1;
        }
        .slider-list__item_active{opacity:1;z-index:2;}
        
        /* 修复：PC端切换按钮核心样式（确保可点击） */
        .slider__arrow {
            position:absolute;top:50%;transform:translateY(-50%);
            width:50px;height:50px; /* PC端足够的点击区域 */
            background:rgba(0,0,0,0.5);border-radius:50%;
            z-index:999; /* 最高层级，避免遮挡 */
            cursor:pointer; /* PC端鼠标指针提示 */
            pointer-events:auto; /* 强制开启点击 */
        }
        .slider__arrow_prev{left:20px;}
        .slider__arrow_next{right:20px;}
        
        /* 修复：导航点样式（PC端可点击） */
        .slider__nav-bar {
            position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
            z-index:999;
            display:flex;gap:10px;
        }
        .nav-control {
            width:12px;height:12px;border-radius:50%;
            background:rgba(255,255,255,0.5);
            cursor:pointer;z-index:999;
        }
        .nav-control.active{background:#fff;} /* 激活态样式 */

        /* 图片加载优化 */
        .back__element {display:block;width:100%;height:100%;}
        .back__element img { 
            width:100%;height:100%;object-fit:cover;
            opacity:0;transition:opacity 0.5s; 
        }
        .back__element img[src] {opacity:1;}
    </style>
</head>
<body>

<section class="page-wrapper" id="coidea">
    <div class="slider">
        <ul class="slider-list">
            <li class="slider-list__item slider-list__item_active">
                <span class="back__element">
                    <img src="assets/img/1.jpg" alt="背景1" loading="lazy" />
                </span>
                <span class="main__element"></span>
                <span class="title__element">
                    <span class="title"></span>
                </span>
                <span class="content">
                    <span class="excerpt"></span>
                    <span class="link"></span>
                </span>
            </li>
            <li class="slider-list__item">
                <span class="back__element">
                    <img src="assets/img/2.jpg" alt="背景2" loading="lazy" />
                </span>
                <span class="title__element">
                    <span class="title"></span>
                    <span class="content">
                        <span class="headline"></span>
                        <span class="excerpt"></span>
                        <span class="link">
                            <div class="fill fill-dark"></div>
                            <a href="#"></a>
                        </span>
                    </span>
                </span>
            </li>
        </ul>
        <div class="slider__nav-bar">
            <a class="nav-control active"></a>
            <a class="nav-control"></a>
        </div>
        <div class="slider__controls">
            <a class="slider__arrow slider__arrow_prev"></a>
            <a class="slider__arrow slider__arrow_next"></a>
        </div>
    </div>      
</section>

<!-- 核心：修复后的JS（包含PC+移动端切换逻辑） -->
<script src="https://cdn.staticfile.org/animejs/3.2.1/anime.min.js"></script>
<script>
    // 全局变量定义
    const sliderList = document.querySelector('.slider-list');
    const sliderItems = document.querySelectorAll('.slider-list__item');
    const navControls = document.querySelectorAll('.nav-control');
    const arrowPrev = document.querySelector('.slider__arrow_prev');
    const arrowNext = document.querySelector('.slider__arrow_next');
    let currentIndex = 0; // 当前激活的滑块索引
    const totalSlides = sliderItems.length; // 滑块总数

    // 核心切换函数（切换到指定索引的滑块）
    function switchToSlide(index) {
        // 1. 移除所有激活态
        sliderItems.forEach(item => item.classList.remove('slider-list__item_active'));
        navControls.forEach(nav => nav.classList.remove('active'));
        
        // 2. 边界处理（防止索引越界）
        currentIndex = index;
        if (currentIndex < 0) currentIndex = totalSlides - 1;
        if (currentIndex >= totalSlides) currentIndex = 0;
        
        // 3. 添加当前激活态
        sliderItems[currentIndex].classList.add('slider-list__item_active');
        navControls[currentIndex].classList.add('active');

        // 可选：保留原有animejs动画（如果有）
        // anime({...}); // 你的原有动画逻辑，无需修改
    }

    // 绑定PC+移动端切换事件（核心修复）
    // 1. 上一页/下一页箭头
    arrowPrev.addEventListener('click', () => switchToSlide(currentIndex - 1)); // PC端click
    arrowPrev.addEventListener('touchstart', () => switchToSlide(currentIndex - 1)); // 移动端touch
    arrowNext.addEventListener('click', () => switchToSlide(currentIndex + 1)); // PC端click
    arrowNext.addEventListener('touchstart', () => switchToSlide(currentIndex + 1)); // 移动端touch

    // 2. 底部导航点
    navControls.forEach((nav, index) => {
        nav.addEventListener('click', () => switchToSlide(index)); // PC端click
        nav.addEventListener('touchstart', () => switchToSlide(index)); // 移动端touch
    });

    // 可选：自动轮播（保留原有功能，无需修改）
    // setInterval(() => switchToSlide(currentIndex + 1), 5000);
</script>

<div style="text-align:center;margin:50px 0; font:normal 14px/24px 'MicroSoft YaHei';">
</div>
</body>
</html>
